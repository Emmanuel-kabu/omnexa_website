name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Next.js app is a subdirectory; the Stage specification documents live at
# the repository root alongside it.
defaults:
  run:
    working-directory: omnexa-web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned to the major the project is developed and verified on, so a local
      # `npm run verify` actually predicts this job. package.json declares the
      # supported floor (>=20.9.0, matching next@16.3.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: omnexa-web/package-lock.json

      # Fonts are vendored in src/fonts, so the build never contacts a font
      # CDN. That is what lets CI run behind a restrictive proxy.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Build
        run: npx next build

      # Redirect the server's output to a file rather than leaving it attached
      # to this step's pipe, and poll with curl rather than adding a wait-on
      # dependency. If startup fails the log is the only evidence of why, so
      # print it here and keep it as an artifact for the audit steps below.
      - name: Start production server
        run: |
          nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server failed to start within 60s"
          cat server.log
          exit 1

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome; scripts/audit-env.mjs
      # discovers it and launches with --no-sandbox --disable-dev-shm-usage.
      - name: Accessibility audit (axe, WCAG 2.2 AA)
        run: node scripts/a11y-audit.mjs

      - name: Interaction audit (keyboard, focus, targets, overflow, motion, scheme)
        run: node scripts/interaction-audit.mjs

      # Asserts the Stage 7 §60 header set is on the wire and that the policy in
      # next.config.ts refuses nothing the site actually needs. Runs against the
      # enforcing policy, so a directive that breaks a page fails the build
      # rather than being discovered in production.
      - name: Security headers and CSP audit
        run: node scripts/csp-audit.mjs

      # Crawls the served site and follows every internal link. Content flags
      # withhold routes, and a withheld route 404s, so anything still linking to
      # one is a dead end. Links are written as JSX attributes, as object
      # properties in navigation arrays, and as template literals with query
      # strings, and no grep pattern catches all three; crawling is
      # shape-independent.
      - name: Internal link integrity
        run: node scripts/link-audit.mjs

      # Gated at 85, no longer advisory. The 74-87 spread that justified
      # continue-on-error was a workstation artefact: two CI runs both scored 93
      # with LCP agreeing to within 0.2% (3164.5ms vs 3163.4ms) despite the
      # runners differing ~6% in CPU benchmark. scripts/lighthouse-gate.mjs
      # holds the threshold and the reasoning, and treats a crashed run with
      # null scores as a failure rather than a pass.
      - name: Lighthouse (performance gated at 85)
        run: |
          npx lighthouse http://localhost:3000/ \
            --output=json --output-path=./lh.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu" --quiet
          node scripts/lighthouse-gate.mjs ./lh.json

      # Uploaded on success and failure alike: when an audit fails on the runner
      # these two files are the only way to diagnose it from outside.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            omnexa-web/lh.json
            omnexa-web/server.log
          if-no-files-found: ignore
