name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Next.js app is a subdirectory; the Stage specification documents live at
# the repository root alongside it.
defaults:
  run:
    working-directory: omnexa-web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omnexa-web/package-lock.json

      # Fonts are vendored in src/fonts, so the build never contacts a font
      # CDN. That is what lets CI run behind a restrictive proxy.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Build
        run: npx next build

      # Poll with curl rather than adding a wait-on dependency.
      - name: Start production server
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start"
          exit 1

      # ubuntu-latest ships Chrome; scripts/audit-env.mjs discovers it.
      - name: Accessibility audit (axe, WCAG 2.2 AA)
        run: node scripts/a11y-audit.mjs

      - name: Interaction audit (keyboard, focus, targets, overflow, motion, scheme)
        run: node scripts/interaction-audit.mjs

      # Reported, not gated: measured scores varied 74-87 run to run on an
      # unloaded machine, so a hard threshold would be flaky rather than
      # informative. Revisit once there is a stable baseline.
      - name: Lighthouse (reported, not gated)
        continue-on-error: true
        run: |
          npx lighthouse http://localhost:3000/ \
            --output=json --output-path=./lh.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu" --quiet
          node -e "const r=require('./lh.json');for(const v of Object.values(r.categories))console.log(v.title.padEnd(16),Math.round(v.score*100));"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: omnexa-web/lh.json
          if-no-files-found: ignore
